s-alimentaires-pendant-la-grossesse"},{"c":"Manger","o":"Salade en sachet","s":"salade lavée, 4e gamme","v":"prudence","p":"Les salades prêtes à l'emploi sont explicitement à relaver.","k":"la relaver deux fois, même « prête à l'emploi »","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/les-precautions-alimentaires-pendant-la-grossesse"},{"c":"Manger","o":"Herbes fraîches","s":"persil, menthe fraîche, coriandre, basilic","v":"oui","p":"Les herbes aromatiques peuvent porter de la terre (toxoplasmose) et de la listeria.","k":"lavées deux fois ; pas d'herbes cueillies dans la nature","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/les-precautions-alimentaires-pendant-la-grossesse"},{"c":"Manger","o":"Graines germées","s":"germes de soja, pousses","v":"non","p":"Les graines germées crues peuvent transmettre la listeria et E. coli.","k":"crues ; oui cuites à haute température","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/les-precautions-alimentaires-pendant-la-grossesse"},{"c":"Manger","o":"Fruits","s":"fruit, kaki, citron","v":"oui","p":"Les fruits apportent vitamines, fibres et folates, et aident contre la constipation.","k":"bien lavés ; un ou deux par jour au moins","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Manger","o":"Ananas","s":"jus d'ananas","v":"oui","p":"Aucune source officielle ne parle de l'ananas pendant la grossesse ; règle générale des fruits.","k":"lavé, comme tout fruit ; aucune source officielle ne le déconseille, malgré la rumeur qu'il ferait faire une fausse couche","g":"","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Manger","o":"Papaye","s":"papaye verte","v":"oui","p":"Aucune source officielle ne parle de la papaye ; règle générale des fruits.","k":"bien mûre, lavée","g":"","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Manger","o":"Mangue","s":"","v":"oui","p":"Aucune source ne la nomme ; règle générale des fruits.","k":"lavée","g":"","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Manger","o":"Kiwi","s":"","v":"oui","p":"Le kiwi est cité parmi les fruits riches en vitamine B9 intéressants pendant la grossesse.","k":"lavé","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Manger","o":"Raisin","s":"","v":"oui","p":"Aucune source ne le nomme ; règle générale des fruits.","k":"lavé","g":"","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Manger","o":"Fenouil","s":"","v":"oui","p":"Aucune source ne le nomme ; règle générale des légumes lavés.","k":"lavé comme tout légume","g":"","u":"https://www.1000-premiers-jours.fr/fr/les-precautions-alimentaires-pendant-la-grossesse"},{"c":"Manger","o":"Cannelle","s":"épices","v":"oui","p":"Rien sur la grossesse ; l'ANSES déconseille les aliments riches en cannelle seulement aux personnes ayant des antécédents hépatiques, et 1000 jours déconseille les huiles essentielles.","k":"en épice culinaire ; pas d'huile essentielle ni de complément à la cannelle","g":"","u":"https://www.anses.fr/fr/actualite/complements-alimentaires-base-plantes-contenant-coumarine-attention-surconsommation"},{"c":"Manger","o":"Plat épicé","s":"piment, épicé, curry, wasabi","v":"oui","p":"Aucune source officielle ne se prononce ; Ameli conseille seulement d'éviter les repas trop gras et copieux en cas de troubles digestifs.","k":"selon la tolérance digestive","g":"","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/enceinte-problemes-de-digestion"},{"c":"Manger","o":"Réglisse","s":"bonbon à la réglisse, zan","v":"non","p":"La réglisse favorise l'hypertension et les troubles du rythme cardiaque : contre-indiquée chez la femme enceinte.","k":"toutes formes : bonbons, zan, pastis sans alcool, sirops, tisanes, compléments","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/les-aliments-eviter-et-les-precautions-d-hygiene-pendant-la-grossesse"},{"c":"Manger","o":"Soja","s":"tofu, lait de soja, tempeh","v":"non","p":"Le soja contient des phyto-œstrogènes, perturbateurs endocriniens : déconseillé par précaution.","k":"tofu, tonyu, desserts au soja, tempeh ; sauce soja occasionnelle tolérée","g":"Ameli + Santé publique France","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/les-aliments-eviter-et-les-precautions-d-hygiene-pendant-la-grossesse"},{"c":"Manger","o":"Gingembre","s":"jus de gingembre, ginger beer","v":"oui","p":"Aucune source officielle ne se prononce sur le gingembre aliment.","k":"en cuisine ; ginger beer = soda sucré à limiter ; pas de complément sans avis médical","g":"","u":"https://www.anses.fr/fr/actualite/complements-alimentaires-grossesse-lanses-recommande-deviter-multiplication-sources"},{"c":"Manger","o":"Miel","s":"","v":"oui","p":"Aucune restriction pour la femme enceinte ; l'interdit (botulisme) ne concerne que le nourrisson.","k":"pour la mère ; interdit au bébé avant 1 an","g":"","u":"https://www.1000-premiers-jours.fr/fr/lhygiene-alimentaire-pendant-la-grossesse-et-pour-bebe"},{"c":"Manger","o":"Noix","s":"noix de cajou, cacahuètes, fruits à coque, amandes","v":"oui","p":"Les fruits à coque apportent des oméga-3 utiles au cerveau du bébé.","k":"une petite poignée par jour, non salées, non sucrées","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/les-cles-dune-alimentation-equilibree"},{"c":"Manger","o":"Chocolat","s":"chocolat noir, Nutella","v":"oui","p":"Produit gras et sucré à ne pas consommer trop souvent ; le chocolat noir apporte un peu de fer et d'iode.","k":"de temps en temps, un carré, plutôt noir 70 %","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/cuisine"},{"c":"Manger","o":"Champignons","s":"champignons crus","v":"prudence","p":"Les champignons cueillis dans la nature peuvent transmettre des parasites ou être toxiques.","k":"champignons du commerce lavés ou cuits ; jamais cueillis dans la nature","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/les-precautions-alimentaires-pendant-la-grossesse"},{"c":"Manger","o":"Algues","s":"wakame, nori, kombu","v":"non","p":"Certaines algues contiennent trop d'iode, risque de surdosage pour la thyroïde.","k":"wakame, nori, kombu, sauf avis médical","g":"Santé publique France (1000 premiers jours) + ANSES","u":"https://www.1000-premiers-jours.fr/fr/les-nutriments-essentiels-au-futur-bebe"},{"c":"Manger","o":"Houmous","s":"","v":"oui","p":"Aucune source ne le nomme ; les légumes secs sont encouragés, les produits à la coupe déconseillés.","k":"maison, ou préemballé consommé vite ; pas à la coupe","g":"","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/difficultes-et-maladies-pendant-la-grossesse/infections/infections-bacteriennes"},{"c":"Manger","o":"Taboulé","s":"","v":"prudence","p":"Pas nommé ; herbes crues à laver, produits servis à la coupe au rayon traiteur à éviter.","k":"maison avec herbes lavées deux fois ; éviter le taboulé à la coupe du traiteur","g":"","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/difficultes-et-maladies-pendant-la-grossesse/infections/infections-bacteriennes"},{"c":"Manger","o":"Gaspacho","s":"","v":"prudence","p":"Pas nommé ; légumes crus à laver, crudités hors domicile à éviter si non immunisée.","k":"maison avec légumes lavés ; si non immunisée, éviter au restaurant","g":"","u":"https://www.ameli.fr/assure/sante/themes/toxoplasmose/prevention"},{"c":"Manger","o":"Kimchi","s":"aliments fermentés","v":"prudence","p":"Aucune source officielle ne se prononce sur les aliments fermentés.","k":"aucune source ; légumes crus fermentés, préférer un produit du commerce conservé au froid","g":"","u":""},{"c":"Manger","o":"Olives","s":"","v":"oui","p":"Aucune source ne les nomme ; les produits salés sont à limiter (5 g de sel par jour).","k":"avec modération (sel)","g":"","u":"https://www.1000-premiers-jours.fr/fr/les-cles-dune-alimentation-equilibree"},{"c":"Manger","o":"Cornichons","s":"","v":"oui","p":"Aucune source ne les nomme ; règle générale de limitation du sel.","k":"avec modération (sel)","g":"","u":"https://www.1000-premiers-jours.fr/fr/les-cles-dune-alimentation-equilibree"},{"c":"Manger","o":"Nems","s":"chinois, restaurant asiatique","v":"oui","p":"Pas nommés ; plat cuit autorisé, crudités hors domicile à éviter si non immunisée.","k":"bien cuits et chauds ; si non immunisée, éviter salade et menthe crues du restaurant","g":"","u":"https://www.ameli.fr/assure/sante/themes/toxoplasmose/prevention"},{"c":"Manger","o":"Restes","s":"plats réchauffés, restes de la veille","v":"prudence","p":"La listeria se développe même au réfrigérateur : délai court et réchauffage complet.","k":"3 jours maximum au frigo, réchauffés chauds uniformément (plus de 70 °C à cœur)","g":"Ameli + ANSES","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/les-aliments-eviter-et-les-precautions-d-hygiene-pendant-la-grossesse"},{"c":"Manger","o":"Plats préparés du traiteur","s":"salade traiteur, taboulé du rayon frais","v":"prudence","p":"Les aliments servis à la coupe au rayon traiteur sont à éviter (listeria).","k":"préemballés, consommés vite après achat ; pas à la coupe ; réchauffés à cœur","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/difficultes-et-maladies-pendant-la-grossesse/infections/infections-bacteriennes"},{"c":"Manger","o":"Sucre","s":"sucreries, bonbons, desserts","v":"prudence","p":"Les aliments sucrés favorisent une prise de poids excessive pendant la grossesse.","k":"à limiter (bonbons, desserts, boissons sucrées)","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/la-prise-de-poids-pendant-la-grossesse"},{"c":"Manger","o":"Édulcorants","s":"aspartame, coca zéro, light","v":"prudence","p":"L'ANSES n'a pas pu conclure sur le risque chez la femme enceinte et ne trouve aucun bénéfice nutritionnel ; 1000 jours déconseille les sodas même light.","k":"à limiter ; sodas « light » à éviter","g":"ANSES + Santé publique France","u":"https://www.anses.fr/fr/actualite/edulcorants-intenses-femme-enceinte-lanses-identifie-nouvelle-etude"},{"c":"Manger","o":"Sel","s":"sel iodé","v":"prudence","p":"Enceinte on a besoin de plus d'iode, mais l'excès de sel favorise l'hypertension.","k":"sel iodé, sans dépasser 5 g par jour","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/cuisine"},{"c":"Manger","o":"Jeûne","s":"jeûner, ramadan, sauter des repas","v":"prudence","p":"Un apport insuffisant peut retentir sur la croissance du fœtus ; aucune source ne parle du ramadan.","k":"ne pas sauter de repas, pas moins de 1 600 kcal par jour ; ramadan : en parler à son médecin ou sa sage-femme","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/alimentation-grossesse"},{"c":"Manger","o":"Régime végétarien","s":"végétarien, végan, sans viande","v":"prudence","p":"Sans produit animal, risque de carence en B12, vitamine D, fer, iode et calcium.","k":"végétarien : pas de règle spécifique ; végétalien ou végan : consulter dès le projet de grossesse, supplémentation B12","g":"Ameli + Santé publique France","u":"https://www.1000-premiers-jours.fr/fr/lalimentation-vegetalienne-pendant-la-grossesse"},{"c":"Boire","o":"Alcool","s":"vin, bière, champagne, apéro, un verre, whisky, guinness, rhum, vodka, cidre","v":"non","p":"L'alcool traverse le placenta et nuit au développement du bébé ; aucune dose sans risque n'est connue.","k":"zéro alcool, toute la grossesse, tous les alcools","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/lalcool-pendant-la-grossesse-et-lallaitement"},{"c":"Boire","o":"Vin cuit","s":"vin chaud, plat au vin, bœuf bourguignon, sauce au vin","v":"prudence","p":"Aucune source ne dit combien d'alcool reste après cuisson ; la règle générale est zéro alcool.","k":"aucune source ; dans le doute, préférer les plats longuement mijotés ou sans vin ; vin chaud = alcool, non","g":"","u":"https://www.1000-premiers-jours.fr/fr/lalcool-pendant-la-grossesse-et-lallaitement"},{"c":"Boire","o":"Bière sans alcool","s":"panaché, Tourtel, vin sans alcool","v":"prudence","p":"Aucune source officielle ne se prononce ; 1000 jours propose plutôt les mocktails et eaux aromatisées.","k":"préférer les « 0,0 % » : une boisson « sans alcool » peut contenir jusqu'à 1,2 % d'alcool (à vérifier en relecture), et la consigne officielle est zéro alcool","g":"","u":"https://www.1000-premiers-jours.fr/fr/lalcool-pendant-la-grossesse-et-lallaitement"},{"c":"Boire","o":"Café","s":"caféine, nespresso, cappuccino, café au lait, nescafé, ricoré","v":"prudence","p":"La caféine augmente le risque de retard de croissance du bébé.","k":"2 à 3 tasses par jour au plus, en comptant le thé, les sodas à la caféine et les boissons énergisantes","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/les-precautions-alimentaires-pendant-la-grossesse"},{"c":"Boire","o":"Décaféiné","s":"déca","v":"oui","p":"Les dosettes décaféinées sont proposées comme alternative au café.","k":"","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/cuisine"},{"c":"Boire","o":"Thé","s":"thé noir, thé vert, matcha, ice tea, lipton","v":"prudence","p":"Le thé contient de la caféine et limite l'absorption du fer végétal pendant le repas.","k":"limiter la caféine ; pas pendant les repas","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/cuisine"},{"c":"Boire","o":"Tisane","s":"infusion, verveine, camomille, tilleul, menthe, rooibos","v":"prudence","p":"Aucune source ne se prononce plante par plante ; 1000 jours cite les infusions non sucrées comme boisson, Ameli interdit les tisanes à la réglisse.","k":"non sucrée ; jamais à la réglisse ; pas d'huile essentielle","g":"Santé publique France (1000 premiers jours) + Ameli","u":"https://www.1000-premiers-jours.fr/fr/leau-consommer-volonte"},{"c":"Boire","o":"Tisane de feuilles de framboisier","s":"framboisier","v":"prudence","p":"Aucune source officielle ne parle du framboisier ; règle générale : pas de produit à base de plantes en automédication.","k":"ne pas prendre sans avis de la sage-femme ou du médecin","g":"","u":"https://www.anses.fr/fr/actualite/complements-alimentaires-grossesse-lanses-recommande-deviter-multiplication-sources"},{"c":"Boire","o":"Coca-Cola","s":"coca, pepsi, soda","v":"prudence","p":"Les sodas apportent trop de sucre et de la caféine.","k":"occasionnel ; sucre et caféine (30 mg par canette) ; light aussi à éviter","g":"Ameli + Santé publique France","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Boire","o":"Boissons énergisantes","s":"Red Bull, Monster, redbull, red bull","v":"non","p":"Trop de caféine (80 à 160 mg par canette) et produit ultratransformé, à éviter pendant la grossesse.","k":"Red Bull, Monster","g":"Ameli + ANSES","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/alimentation-grossesse"},{"c":"Boire","o":"Boissons gazeuses","s":"eau gazeuse, Perrier, Fanta, Sprite, Orangina, Schweppes","v":"prudence","p":"Les sodas, même light, apportent trop de sucre ; rien sur l'eau gazeuse pour la femme enceinte.","k":"eau gazeuse : pas de règle ; sodas (Fanta, Sprite, Orangina, Schweppes) à éviter","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Boire","o":"Eau du robinet","s":"eau","v":"oui","p":"L'eau du robinet est l'aliment le plus contrôlé ; le plomb traverse le placenta.","k":"sauf canalisations en plomb (immeuble d'avant 1949)","g":"Santé publique France (1000 premiers jours) + Ameli","u":"https://www.1000-premiers-jours.fr/fr/leau-consommer-volonte"},{"c":"Boire","o":"Eaux minérales","s":"Hépar, Contrex","v":"oui","p":"Ameli cite les eaux minérales riches en calcium comme alternative aux produits laitiers.","k":"aucune ; les eaux riches en calcium aident si on n'aime pas les laitages","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/alimentation-grossesse"},{"c":"Boire","o":"Jus de fruits","s":"jus d'orange, jus de pomme, smoothie","v":"prudence","p":"Les jus sont très sucrés, même « sans sucres ajoutés », et ne valent pas une portion de fruit.","k":"un verre par jour maximum","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Boire","o":"Jus frais pressé non pasteurisé","s":"jus pressé","v":"prudence","p":"1000 jours recommande de préférence le jus pressé soi-même ; aucune source sur les jus non pasteurisés du commerce.","k":"pressé soi-même avec des fruits lavés, bu tout de suite ; un verre par jour","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Boire","o":"Kombucha","s":"","v":"prudence","p":"Aucune source officielle ne se prononce sur le kombucha.","k":"boisson fermentée non pasteurisée, qui contient souvent des traces d'alcool","g":"","u":""},{"c":"Boire","o":"Maté","s":"guarana","v":"prudence","p":"Maté et guarana contiennent de la caféine, sur laquelle l'ANSES demande une vigilance particulière chez la femme enceinte.","k":"compter dans la caféine du jour (maté, guarana)","g":"ANSES","u":"https://www.anses.fr/fr/article/cafeine-nos-conseils-eviter-effets-indesirables"},{"c":"Boire","o":"Lait d'or","s":"curcuma","v":"oui","p":"Rien sur la grossesse pour le curcuma aliment ; l'ANSES alerte seulement sur les compléments à base de curcuma (hépatites).","k":"curcuma en épice dans un lait pasteurisé ; pas de complément au curcuma sans avis médical","g":"","u":"https://www.anses.fr/fr/actualite/effets-indesirables-lies-consommation-complements-alimentaires-contenant-du-curcuma"},{"c":"Boire","o":"Bissap","s":"jus d'hibiscus","v":"prudence","p":"Aucune source officielle ne parle de l'hibiscus ; règle générale des boissons sucrées à limiter.","k":"aucune source ; souvent très sucré","g":"","u":"https://www.1000-premiers-jours.fr/fr/refrigerateur"},{"c":"Bouger","o":"Sport","s":"activité physique, faire du sport","v":"oui","p":"Bouger régulièrement à intensité modérée est recommandé et n'augmente ni le risque de prématurité ni celui de pré-éclampsie.","k":"grossesse sans complication, intensité modérée (on peut parler pendant l'effort), 150 à 180 min par semaine en plusieurs séances, 60 à 90 min max par séance ; avis médical si sportive intensive avant","g":"Ameli (reprend HAS 2022)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Marche","s":"randonnée","v":"oui","p":"La marche fait partie des activités les plus recommandées ; seul le terrain accidenté expose à la chute.","k":"chaussures adaptées, boire ; randonnée en terrain accidenté à éviter à partir du 4e-6e mois","g":"Ameli ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Natation","s":"nager, piscine, aquagym","v":"oui","p":"Nager ou marcher dans l'eau ménage les articulations et aide le retour veineux.","k":"aquagym incluse","g":"Ameli ; Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/quelles-activites-physiques-pendant-la-grossesse"},{"c":"Bouger","o":"Se baigner en mer","s":"mer, lac, baignade","v":"aucune","p":"Aucune page ne traite la baignade en mer ou en lac ; la natation est recommandée et l'exposition solaire à limiter.","k":"règle générale : natation recommandée ; ne pas s'exposer au soleil, éviter la chaleur","g":"","u":"https://www.1000-premiers-jours.fr/fr/quelles-activites-physiques-pendant-la-grossesse"},{"c":"Bouger","o":"Yoga","s":"yoga prénatal","v":"oui","p":"Le yoga ne présente pas de risque si l'on évite les positions qui provoquent une baisse de tension.","k":"éviter les postures qui font baisser la tension ; pas d'exercice allongée sur le dos à partir de 24 SA","g":"Ameli (reprend HAS 2022)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Yoga chaud","s":"bikram","v":"non","p":"Rien sur le bikram en particulier, mais l'activité physique en ambiance chaude et humide est à éviter.","k":"règle générale : éviter les environnements chauds et humides pendant l'effort","g":"Ameli (reprend HAS 2022)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions"},{"c":"Bouger","o":"Pilates","s":"","v":"oui","p":"Le Pilates ne présente pas de risque, il existe même des cours dédiés aux femmes enceintes.","k":"éviter les postures qui font baisser la tension ; pas d'abdominaux à partir du 4e mois","g":"Ameli ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Course à pied","s":"courir, running, jogging","v":"prudence","p":"Le jogging n'est pas interdit mais demande un feu vert médical préalable.","k":"demander l'avis du médecin ou de la sage-femme avant","g":"Ameli (reprend HAS 2022)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Vélo","s":"vélo d'appartement, bicyclette","v":"prudence","p":"Le ventre déplace le centre de gravité : le vélo sur route expose à la chute, pas le vélo stationnaire.","k":"vélo d'appartement : oui tout au long ; vélo en extérieur à éviter à partir du 4e-6e mois","g":"Ameli ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Musculation","s":"muscu, abdos","v":"prudence","p":"Le renforcement modéré est recommandé, mais la musculation demande l'avis du soignant et pas d'effort en apnée.","k":"avis médical avant ; renforcement modéré 1 à 2 fois par semaine conseillé ; pas de blocage de la respiration, pas de charges lourdes","g":"Ameli (reprend HAS 2022) ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Abdominaux","s":"gainage, crunch","v":"non","p":"Passé le 4e mois, on arrête les exercices d'abdominaux.","k":"à partir du 4e mois : plus de renforcement abdominal ; privilégier le plancher pelvien","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/quelles-activites-physiques-pendant-la-grossesse"},{"c":"Bouger","o":"Zumba","s":"danse","v":"prudence","p":"La danse est citée parmi les activités possibles ; l'intensité doit rester celle où l'on peut parler.","k":"règle générale : danser compte comme activité physique, à intensité modérée et faible impact","g":"Santé publique France (1000 premiers jours) ; Ameli","u":"https://www.1000-premiers-jours.fr/fr/lactivite-physique-pendant-la-grossesse"},{"c":"Bouger","o":"Ski","s":"snowboard","v":"non","p":"Le ski alpin est contre-indiqué car le risque de chute est élevé.","k":"toute la grossesse","g":"Ameli (reprend HAS 2022) ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Équitation","s":"cheval","v":"non","p":"L'équitation est contre-indiquée en raison du risque de chute.","k":"toute la grossesse","g":"Ameli (reprend HAS 2022) ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Escalade","s":"","v":"non","p":"L'escalade n'est pas citée, mais les activités où l'on peut tomber sont à éviter.","k":"règle générale : activités à haut risque de chute contre-indiquées","g":"Ameli (reprend HAS 2022)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Sports de combat","s":"boxe, judo, karaté","v":"non","p":"Les coups sur le ventre font de ces sports une contre-indication.","k":"toute la grossesse (boxe, judo, karaté, arts martiaux)","g":"Ameli (reprend HAS 2022) ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Sports collectifs","s":"foot, basket, handball, rugby","v":"non","p":"Le risque de choc sur l'abdomen les rend contre-indiqués.","k":"sports collectifs avec contacts physiques et sports de ballon","g":"Ameli (reprend HAS 2022) ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Plongée sous-marine","s":"plongée","v":"non","p":"Le fœtus peut faire un accident de décompression.","k":"toute la grossesse","g":"Ameli (reprend HAS 2022) ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Altitude","s":"montagne, randonnée en altitude","v":"non","p":"L'effort en altitude réduit le débit sanguin qui arrive au fœtus.","k":"activité physique en altitude à éviter ; le simple séjour en montagne n'est pas traité","g":"Ameli (reprend HAS 2022)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions"},{"c":"Bouger","o":"Tennis","s":"badminton, padel","v":"prudence","p":"Ameli admet les sports de raquette pour les joueuses aguerries, en surveillant le risque de chute.","k":"oui si tu jouais déjà avant, à un rythme tranquille ; pas le moment de commencer","g":"Ameli (reprend HAS 2022) ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Bouger","o":"Attractions","s":"manège, Disney, parc d'attractions","v":"non","p":"Aucune page ne parle des manèges, mais chocs et secousses sur le ventre sont à éviter.","k":"règle générale : activités à risque de chute ou de choc sur le ventre à éviter ; secousses déconseillées","g":"Ameli (reprend HAS 2022) ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions"},{"c":"Bouger","o":"Karting","s":"quad, moto","v":"non","p":"Rien sur le karting, le quad ou la moto, mais les chocs et secousses sur le ventre sont à éviter.","k":"règle générale : activités à risque de chute ou de traumatisme abdominal, secousses déconseillées","g":"Ameli (reprend HAS 2022) ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions"},{"c":"Bouger","o":"Bowling","s":"","v":"aucune","p":"Aucune page ne traite le bowling ; on retombe sur l'effort modéré et la prudence face aux chutes.","k":"règle générale : activité modérée, attention à l'équilibre et pas de charge lourde","g":"","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions"},{"c":"Bouger","o":"Trampoline","s":"","v":"non","p":"Le trampoline n'est pas cité, mais tout ce qui expose à la chute est à éviter.","k":"règle générale : activités à risque de chute","g":"Ameli (reprend HAS 2022)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/grossesse-choix-activite-physique"},{"c":"Soins et beauté","o":"Coloration","s":"teinture, couleur, mèches, balayage, cheveux, teindre ses cheveux, coiffeur","v":"prudence","p":"Les produits de coiffure peuvent contenir des perturbateurs endocriniens suspectés et des allergènes, mieux vaut en limiter l'usage.","k":"limiter ; pas d'interdiction formulée","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/salle-de-bain"},{"c":"Soins et beauté","o":"Lissage","s":"lissage brésilien, défrisage, permanente, défriser, cheveux","v":"prudence","p":"Rien sur le lissage brésilien ou le défrisage en particulier, mais les produits capillaires sont à limiter.","k":"règle générale : limiter les produits de coiffure","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/salle-de-bain"},{"c":"Soins et beauté","o":"Vernis à ongles","s":"faux ongles, manucure, semi-permanent","v":"prudence","p":"Certains vernis contiennent des perturbateurs endocriniens suspectés ou des allergènes.","k":"limiter ; ongles naturels (mains et pieds) le jour de l'accouchement, indispensable en cas d'anesthésie","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/salle-de-bain"},{"c":"Soins et beauté","o":"Épilation","s":"épilation laser, cire, épilation électrique","v":"aucune","p":"Aucune page ne se prononce sur la cire, l'épilateur ou le laser pendant la grossesse.","k":"règle générale : limiter les produits appliqués sur la peau (crèmes dépilatoires) ; laser non traité","g":"","u":"https://www.1000-premiers-jours.fr/fr/salle-de-bain"},{"c":"Soins et beauté","o":"Tatouage","s":"se faire tatouer, piercing","v":"aucune","p":"Aucune source officielle ne traite le tatouage ou le piercing pendant la grossesse.","k":"aucune règle générale trouvée (l'ANSES assure la tatouvigilance sans conseil grossesse)","g":"","u":"https://www.anses.fr/fr/article/cosmetiques-comment-mieux-proteger-sante-consommateurs"},{"c":"Soins et beauté","o":"Huiles essentielles","s":"diffuseur, respirer des huiles essentielles","v":"non","p":"Elles contiennent des substances neurotoxiques ou toxiques pour l'embryon et des composés allergisants.","k":"toute la grossesse et l'allaitement, y compris en diffuseur ou en spray","g":"ANSES ; Santé publique France (1000 premiers jours)","u":"https://www.anses.fr/fr/article/huiles-essentielles-risques-precautions"},{"c":"Soins et beauté","o":"Rétinol","s":"crème anti-âge, rétinoïdes, acide salicylique","v":"prudence","p":"Les rétinoïdes en médicament sont tératogènes ; pour les cosmétiques, seule vaut la consigne de limiter ce qu'on applique sur la peau.","k":"par précaution, on met de côté les crèmes au rétinol, faute de données ; les rétinoïdes en médicament (isotrétinoïne, acitrétine) sont interdits","g":"Ameli ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/medicament-grossesse"},{"c":"Soins et beauté","o":"Autobronzant","s":"","v":"aucune","p":"Aucune page ne traite l'autobronzant ; la consigne générale est de réduire les cosmétiques.","k":"règle générale : limiter les produits appliqués sur la peau","g":"","u":"https://www.1000-premiers-jours.fr/fr/salle-de-bain"},{"c":"Soins et beauté","o":"Bronzer","s":"soleil, s'exposer au soleil, bronzage","v":"prudence","p":"Les UV favorisent le masque de grossesse et la ligne brune sur le ventre, en plus du risque de cancer de la peau.","k":"se couvrir, éviter le soleil entre 12 h et 16 h","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/salle-de-bain"},{"c":"Soins et beauté","o":"UV en cabine","s":"cabine UV","v":"non","p":"Les cabines ne sont pas citées, mais l'exposition aux UV est à éviter (hyperpigmentation).","k":"règle générale : se protéger des UV pendant la grossesse","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/salle-de-bain"},{"c":"Soins et beauté","o":"Massage","s":"se faire masser, massage prénatal","v":"oui","p":"Les massages soulagent le dos, les jambes et la peau qui tire, et peuvent être faits par le partenaire.","k":"massage de la peau, du dos et des jambes ; le massage prénatal en institut n'est pas traité","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/les-petits-maux-de-la-grossesse"},{"c":"Soins et beauté","o":"Bain chaud","s":"bain, bouillotte","v":"prudence","p":"Oui à un bain tiède ; l'eau très chaude fait monter ta température et peut donner des malaises.","k":"Repère : une eau à peu près à la température du corps (un peu chaude au toucher, pas brûlante). Si tu transpires, rougis ou as la tête qui tourne, c'est trop chaud : on sort.","g":"Ameli (reprend HAS 2022)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions","b":1},{"c":"Soins et beauté","o":"Sauna","s":"hammam","v":"prudence","p":"Plutôt à éviter : c'est exactement la chaleur forte qui fait monter la température du corps, surtout au premier trimestre.","k":"surtout à éviter au premier trimestre ; si tu y vas, court, et tu sors dès que tu as chaud ou la tête qui tourne","g":"Ameli (reprend HAS 2022) ; ACOG","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions"},{"c":"Soins et beauté","o":"Jacuzzi","s":"spa, bain à remous","v":"prudence","p":"Plutôt à éviter si l'eau est chaude (souvent autour de 40 °C), surtout au premier trimestre ; une eau tiède ne pose pas le même problème.","k":"Repère : une eau à peu près à la température du corps (un peu chaude au toucher, pas brûlante). Si tu transpires, rougis ou as la tête qui tourne, c'est trop chaud : on sort.","g":"Ameli (reprend HAS 2022) ; ACOG","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions","b":1},{"c":"Soins et beauté","o":"Dentiste","s":"soins dentaires, détartrage, enlever une dent","v":"oui","p":"Les gencives sont plus fragiles pendant la grossesse, d'où un rendez-vous dentaire pris en charge.","k":"examen bucco-dentaire offert du 1er jour du 4e mois jusqu'à 6 mois après l'accouchement ; détartrage et extraction non détaillés","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse/femme-enceinte-soins-dentaire-mtdents"},{"c":"Soins et beauté","o":"Toilette intime","s":"douche vaginale, savon intime","v":"aucune","p":"Aucune source officielle ne traite la douche vaginale ou le savon intime pendant la grossesse.","k":"aucune règle générale trouvée","g":"","u":""},{"c":"Soins et beauté","o":"Vergetures","s":"crème anti-vergetures","v":"oui","p":"On ne peut pas vraiment les empêcher, mais masser la peau soulage ; une crème dédiée est inutile.","k":"crème hydratante, huile d'amande douce ou karité ; pas besoin de crème spéciale ; huiles végétales sans huile essentielle","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/salle-de-bain"},{"c":"Au quotidien","o":"Fumer","s":"cigarette, tabac","v":"non","p":"Les composés de la fumée passent au bébé et nuisent à sa croissance et au terme de la grossesse.","k":"arrêt dès que possible, réduire est toujours bénéfique ; substituts nicotiniques autorisés sous contrôle médical","g":"Ameli ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/tabac-alcool-drogue-et-grossesse/conduites-risques-tabac-drogues"},{"c":"Au quotidien","o":"Vapoter","s":"cigarette électronique, vape","v":"non","p":"La cigarette électronique et les produits du vapotage ne doivent pas être utilisés pendant la grossesse.","k":"toute la grossesse ; préférer les substituts nicotiniques sous contrôle médical","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/tabac-alcool-drogue-et-grossesse/conduites-risques-tabac-drogues"},{"c":"Au quotidien","o":"Cannabis","s":"CBD, joint","v":"non","p":"Pas de malformation retenue, mais un risque accru de prématurité et de fausse couche ; en parler au soignant si consommation en début de grossesse.","k":"toute la grossesse ; CBD seul non traité","g":"Santé publique France (1000 premiers jours) ; Ameli","u":"https://www.1000-premiers-jours.fr/fr/le-cannabis-pendant-la-grossesse"},{"c":"Au quotidien","o":"Tabagisme passif","s":"fumée, entourage qui fume","v":"non","p":"La fumée respirée à côté d'un fumeur transmet ses substances chimiques au bébé.","k":"demander à l'entourage de ne pas fumer près de soi","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/larret-du-tabac-pendant-la-grossesse-et-lallaitement"},{"c":"Au quotidien","o":"Litière du chat","s":"chat, toucher un chat","v":"prudence","p":"Les déjections du chat peuvent transmettre la toxoplasmose à une femme non immunisée.","k":"si non immunisée contre la toxoplasmose : faire changer la litière par quelqu'un d'autre ; sinon gants et bac lavé chaque jour à l'eau à plus de 70 °C (la Javel ne sert à rien)","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/difficultes-et-maladies-pendant-la-grossesse/infections/infections-parasites"},{"c":"Au quotidien","o":"Jardinage","s":"jardiner, terre","v":"prudence","p":"La terre peut porter le parasite de la toxoplasmose ; le jardinage compte par ailleurs comme activité physique.","k":"gants pour tout contact avec la terre, puis lavage des mains (consigne visant les non-immunisées contre la toxoplasmose)","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/difficultes-et-maladies-pendant-la-grossesse/infections/infections-parasites"},{"c":"Au quotidien","o":"Peinture","s":"peindre, repeindre, travaux","v":"non","p":"Peintures, vernis et colles émettent des substances chimiques dont la future mère doit se tenir à l'écart.","k":"ne pas participer aux travaux ; les finir au moins 3 mois avant la naissance, peintures A+, aérer longuement","g":"Ameli ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-environnement/grossesse-environnement"},{"c":"Au quotidien","o":"Produits ménagers","s":"ménage, javel","v":"prudence","p":"Les produits d'entretien sont une source de perturbateurs endocriniens et de polluants de l'air intérieur.","k":"moins de produits, pas de sprays, produits simples (vinaigre blanc, savon de Marseille, bicarbonate) ou écolabellisés, aérer pendant et après","g":"Ameli","u":"https://www.ameli.fr/assure/actualites/grossesse-et-petite-enfance-reduire-l-exposition-aux-polluants-du-quotidien"},{"c":"Au quotidien","o":"Insecticides","s":"anti-moustique, répulsif","v":"prudence","p":"Les insecticides font partie des polluants à limiter ; contre les moustiques, les protections physiques suffisent le plus souvent.","k":"insecticides d'ambiance (bombes, diffuseurs électriques) : à éviter ; répulsif cutané seulement s'il est adapté aux femmes enceintes et en cas de risque réel (voyage, épidémie, avis ARS) ; pas d'huiles essentielles","g":"Ameli ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-environnement/grossesse-environnement"},{"c":"Au quotidien","o":"Dormir sur le ventre","s":"se coucher sur le ventre","v":"oui","p":"Tant que c'est confortable, ça ne fait pas de mal à bébé.","k":"le ventre finit par l'empêcher tout seul","g":"","u":"","b":1},{"c":"Au quotidien","o":"Dormir sur le dos","s":"se coucher sur le dos","v":"prudence","p":"À partir du 6e mois, le poids de l'utérus peut comprimer une grosse veine et donner un malaise.","k":"sans souci au début ; à partir de 24 SA, on préfère le côté ; si tu te réveilles sur le dos, pas de panique, tu te tournes","g":"Ameli (reprend HAS 2022)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions"},{"c":"Au quotidien","o":"Dormir sur le côté","s":"côté gauche, côté droit","v":"oui","p":"C'est la position conseillée en fin de grossesse.","k":"gauche ou droit","g":"Ameli (reprend HAS 2022)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions"},{"c":"Au quotidien","o":"Faire l'amour","s":"rapports, sexe, sexualité","v":"oui","p":"Ameli parle des relations sexuelles pendant la grossesse sans les déconseiller, seulement en prévenant les infections.","k":"préservatif en cas de risque d'IST ; pas de rapport, même protégé, pendant une poussée d'herpès génital (soi ou partenaire)","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/difficultes-et-maladies-pendant-la-grossesse/infections/recherche-prevention"},{"c":"Au quotidien","o":"Porter des charges","s":"porter lourd, porter un enfant","v":"non","p":"Porter lourd fait partie des efforts à éviter pendant la grossesse.","k":"charges lourdes à éviter (packs d'eau, meubles), y compris au travail ; porter un enfant non traité","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/quelles-activites-physiques-pendant-la-grossesse"},{"c":"Au quotidien","o":"Rester debout longtemps","s":"rester debout","v":"prudence","p":"La station debout prolongée fait baisser la tension et peut provoquer un malaise.","k":"limiter ; à éviter à partir du 3e trimestre","g":"Ameli (reprend HAS 2022) ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-activite-physique/enceinte-active-precautions"},{"c":"Au quotidien","o":"Talons","s":"chaussures à talons","v":"aucune","p":"Aucune page ne traite les talons ; le centre de gravité se déplace et les chutes deviennent plus probables.","k":"règle générale : l'équilibre change à partir du 4e mois, le risque de chute augmente","g":"","u":"https://www.1000-premiers-jours.fr/fr/quelles-activites-physiques-pendant-la-grossesse"},{"c":"Au quotidien","o":"Ceinture de sécurité","s":"ceinture en voiture","v":"oui","p":"La ceinture protège la mère et le bébé, à condition de la placer sous le ventre.","k":"toujours ; partie basse sous le ventre, sur l'os du bassin ; partie haute de l'épaule, entre les seins","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/voyager-pendant-la-grossesse-ou-avec-bebe"},{"c":"Au quotidien","o":"Conduire","s":"voiture","v":"aucune","p":"Aucune page ne se prononce sur le fait de conduire ; seuls les longs trajets sont déconseillés.","k":"règle générale : longs trajets et secousses déconseillés, à éviter au 3e trimestre ; pauses pour marcher","g":"","u":"https://www.1000-premiers-jours.fr/fr/voyager-pendant-la-grossesse-ou-avec-bebe"},{"c":"Au quotidien","o":"Radio","s":"radiographie, scanner","v":"aucune","p":"Aucune source accessible ne détaille radio ou scanner pendant la grossesse (page HAS inaccessible).","k":"règle générale : signaler sa grossesse à tout soignant ; les rayons figurent parmi les nuisances à éviter au travail","g":"","u":"https://www.1000-premiers-jours.fr/fr/lenvironnement-professionnel-des-futurs-parents"},{"c":"Au quotidien","o":"IRM","s":"","v":"aucune","p":"Aucune source accessible ne traite l'IRM pendant la grossesse (page HAS inaccessible).","k":"aucune règle générale trouvée hors « signaler sa grossesse au soignant »","g":"","u":""},{"c":"Au quotidien","o":"Vaccin grippe","s":"grippe","v":"oui","p":"La grippe peut se compliquer pendant la grossesse, le vaccin protège la mère et le futur bébé.","k":"chaque année, à tout trimestre, dès l'ouverture de la campagne (13 octobre) ; peut se faire en même temps que coqueluche et Covid","g":"Ameli","u":"https://www.ameli.fr/assure/actualites/le-vaccin-contre-la-grippe-essentiel-pour-proteger-les-femmes-enceintes-et-leur-futur-enfant"},{"c":"Au quotidien","o":"Vaccin coqueluche","s":"coqueluche","v":"oui","p":"Les anticorps transmis protègent le nouveau-né avant ses propres vaccins (recommandation HAS).","k":"à partir du 2e trimestre, de préférence entre 20 et 36 SA, à chaque grossesse même si vaccinée récemment","g":"Ameli (reprend HAS)","u":"https://www.ameli.fr/assure/sante/themes/coqueluche/eviter-transmission-medicaments-vaccin"},{"c":"Au quotidien","o":"Vaccin Covid","s":"covid","v":"oui","p":"Les femmes enceintes, surtout au 3e trimestre, risquent une forme grave de Covid.","k":"possible pendant la grossesse, recommandé en même temps que la grippe en période de circulation","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/difficultes-et-maladies-pendant-la-grossesse/infections/recherche-prevention"},{"c":"Au quotidien","o":"Donner son sang","s":"don du sang","v":"aucune","p":"Les pages lues ne disent pas si l'on peut donner son sang enceinte ; l'EFS, hors liste, n'a pas été retenu.","k":"aucune règle trouvée dans les sources acceptées (Ameli, SpF, HAS, ANSM, service-public)","g":"","u":""},{"c":"Au quotidien","o":"Concert","s":"bruit, festival","v":"prudence","p":"Le bébé entend à partir de la fin de grossesse et doit être protégé des bruits trop intenses (un concert atteint 105 dB).","k":"au 3e trimestre, éviter de rester longtemps dans un lieu très bruyant","g":"Ameli ; Santé publique France (1000 premiers jours)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-environnement/grossesse-audition-bruits"},{"c":"Au quotidien","o":"Travail de nuit","s":"travailler de nuit","v":"aucune","p":"Aucune page lue ne traite le travail de nuit ; c'est le médecin du travail qui évalue les risques du poste.","k":"règle générale : informer le médecin du travail au plus tôt pour adapter le poste","g":"","u":"https://www.1000-premiers-jours.fr/fr/lenvironnement-professionnel-des-futurs-parents"},{"c":"Voyager","o":"Avion","s":"prendre l'avion, voyage en avion","v":"oui","p":"L'avion est possible avec des précautions contre la phlébite, puis contre-indiqué en fin de grossesse.","k":"jusqu'à 36 SA (32 SA si grossesse multiple) ; bas de contention, se lever régulièrement","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/voyager-pendant-la-grossesse-ou-avec-bebe"},{"c":"Voyager","o":"Long trajet en voiture","s":"voyager en voiture","v":"prudence","p":"Longs trajets et secousses fatiguent et sont déconseillés ; le train est le mode le plus adapté.","k":"déconseillé, à éviter au 3e trimestre ; pauses régulières pour marcher ; ceinture sous le ventre ; train à privilégier","g":"Santé publique France (1000 premiers jours)","u":"https://www.1000-premiers-jours.fr/fr/voyager-pendant-la-grossesse-ou-avec-bebe"},{"c":"Voyager","o":"Bateau","s":"croisière","v":"aucune","p":"Aucune page ne traite la croisière ; on retombe sur les conseils généraux de voyage enceinte.","k":"règle générale : meilleure période pour voyager entre 16 et 28 SA ; demander conseil avant de partir ; aucun anti-nauséeux sans avis","g":"","u":"https://www.1000-premiers-jours.fr/fr/voyager-pendant-la-grossesse-ou-avec-bebe"},{"c":"Voyager","o":"Pays à risque Zika","s":"Zika, Antilles, moustiques","v":"prudence","p":"Le virus Zika contracté pendant la grossesse peut causer des malformations du système nerveux du bébé.","k":"consulter un médecin avant, protections anti-moustiques, préservatif toute la grossesse, consulter au moindre symptôme et signaler le séjour au retour","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/difficultes-et-maladies-pendant-la-grossesse/infections/infections-virales"},{"c":"Voyager","o":"Paludisme","s":"pays tropicaux, antipaludéens","v":"non","p":"Le paludisme pendant la grossesse expose à la fausse couche, à la prématurité et au petit poids de naissance.","k":"voyage en zone d'endémie déconseillé ; si indispensable, traitement préventif obligatoire, prescrit par un médecin","g":"Ameli","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/difficultes-et-maladies-pendant-la-grossesse/infections/infections-parasites"},{"c":"Voyager","o":"Vaccin fièvre jaune","s":"fièvre jaune","v":"non","p":"C'est un vaccin vivant atténué, contre-indiqué pendant la grossesse.","k":"contre-indiqué sauf risque d'infection très élevé, sur décision médicale ; rappel ensuite nécessaire","g":"Ameli","u":"https://www.ameli.fr/assure/sante/themes/vaccination/vaccination-voyage"},{"c":"Médicaments","o":"Paracétamol","s":"Doliprane, Dafalgan, Efferalgan, Tylenol","v":"oui","p":"Données très nombreuses sans effet malformatif, fœtal ou néonatal retenu : c'est l'antalgique et l'antifièvre de référence pendant la grossesse.","k":"Quel que soit le terme ; dose minimale efficace, durée la plus courte possible","g":"CRAT","u":"https://www.lecrat.fr/4165/"},{"c":"Médicaments","o":"Ibuprofène","s":"Advil, Nurofen, Spedifen, anti-inflammatoire, AINS","v":"prudence","p":"Pas d'effet malformatif retenu au 1er trimestre, mais tous les AINS peuvent abîmer le cœur (canal artériel) et les reins du fœtus, risque qui culmine à partir de 24 SA et peut être mortel.","k":"Avant 24 SA : prise ponctuelle envisageable, prise chronique à éviter (si indispensable après 13 SA, surveiller le liquide amniotique), toujours sur avis médical, pas d'automédication. À partir de 24 SA (début du 6e mois) : formellement contre-indiqué, même en prise unique, quelle que soit la voie (y compris gel)","g":"CRAT","u":"https://www.lecrat.fr/15292/"},{"c":"Médicaments","o":"Aspirine","s":"Kardégic","v":"prudence","p":"À forte dose l'aspirine agit comme un AINS et menace le cœur et les reins du fœtus ; à petite dose elle n'a pas cet effet.","k":"Dose anti-agrégante (Kardégic, jusqu'à ~300 mg/j, sur prescription) : possible toute la grossesse. Dose ≥ 500 mg/j : ponctuelle possible avant 24 SA, contre-indiquée à partir de 24 SA même en prise unique. Pas d'automédication","g":"CRAT","u":"https://www.lecrat.fr/4172/"},{"c":"Médicaments","o":"Anti-inflammatoire en gel","s":"Voltaren, Flector, gel","v":"prudence","p":"La peau laisse passer assez de produit pour exposer le fœtus aux mêmes risques cardiaques et rénaux que le comprimé : la voie cutanée ne protège pas.","k":"Avant 24 SA : application ponctuelle envisageable, sur avis médical. À partir de 24 SA : formellement contre-indiqué, même une seule application (seuls les collyres AINS font exception)","g":"CRAT","u":"https://www.lecrat.fr/15298/ (diclofénac, dont Voltarene Emulgel et Flector)"},{"c":"Médicaments","o":"Spasfon","s":"phloroglucinol","v":"oui","p":"Aucun risque malformatif identifié : l'antispasmodique peut être pris tout au long de la grossesse.","k":"Quel que soit le terme","g":"CRAT","u":"https://www.lecrat.fr/11748/"},{"c":"Médicaments","o":"Smecta","s":"diosmectite, diarrhée","v":"non","p":"L'argile naturelle de la diosmectite peut contenir des traces de plomb, l'ANSM préfère donc l'écarter chez la femme enceinte, sans aucun cas d'intoxication connu.","k":"Toute la grossesse (mesure de précaution) ; le CRAT cite encore « une argile type Smecta » pour la diarrhée aiguë, mais l'ANSM, autorité du médicament, la déconseille. Alternative : lopéramide","g":"ANSM (+ CRAT, divergent)","u":"https://ansm.sante.fr/actualites/medicaments-a-base-dargile-dans-le-traitement-symptomatique-de-la-diarrhee-aigue-chez-lenfant"},{"c":"Médicaments","o":"Gaviscon","s":"brûlures d'estomac, reflux, maalox","v":"oui","p":"Les alginates font partie des antiacides utilisables pendant toute la grossesse contre les brûlures d'estomac.","k":"Quel que soit le terme, si un traitement du reflux est nécessaire","g":"CRAT","u":"https://www.lecrat.fr/12854/"},{"c":"Médicaments","o":"Imodium","s":"lopéramide","v":"oui","p":"Pas de risque malformatif retenu pour le lopéramide en traitement court.","k":"Diarrhée aiguë sans signe de gravité : quel que soit le terme. Diarrhée chronique : à réévaluer avec un médecin (pas de données au long cours)","g":"CRAT","u":"https://www.lecrat.fr/6597/"},{"c":"Médicaments","o":"Antibiotiques","s":"amoxicilline","v":"prudence","p":"L'amoxicilline est bien connue et sans risque retenu, mais « antibiotique » recouvre des molécules au profil très différent, d'où l'avis médical.","k":"Amoxicilline : possible quel que soit le terme, sur prescription. Les autres antibiotiques se jugent molécule par molécule (ex. doxycycline : on préfère un autre antibiotique après le 1er trimestre, risque de coloration des dents de lait)","g":"CRAT","u":"https://www.lecrat.fr/6654/"},{"c":"Médicaments","o":"Vicks","s":"Vicks VapoRub, camphre","v":"non","p":"Le camphre, l'eucalyptus et la térébenthine qu'il contient sont des dérivés terpéniques peu ou pas étudiés chez la femme enceinte : la notice officielle le déconseille.","k":"Toute la grossesse","g":"ANSM (Base de données publique des médicaments, RCP rubrique 4.6)","u":"https://base-donnees-publique.medicaments.gouv.fr/extrait.php?specid=64072763"},{"c":"Médicaments","o":"Médicaments contre le rhume","s":"Fervex, Actifed, pseudoéphédrine, vasoconstricteur","v":"non","p":"Les vasoconstricteurs par la bouche resserrent les vaisseaux et sont à éviter chez la femme enceinte, alors que des solutions locales sans risque existent.","k":"Toute la grossesse pour les comprimés avec vasoconstricteur (pseudoéphédrine, phényléphrine : Actifed, Dolirhume, Humex rhume…), seuls ou associés à un antihistaminique ou un antifièvre (type Fervex). À la place : lavage au sérum physiologique / eau de mer en 1re intention ; éphédrine nasale ponctuelle et courte possible ; paracétamol seul pour la fièvre","g":"CRAT (qui renvoie à l'ANSM)","u":"https://www.lecrat.fr/4993/"},{"c":"Médicaments","o":"Pastilles pour la gorge","s":"Strepsils, Valda, Halls","v":"aucune","p":"Pas de donnée officielle propre aux pastilles ; à faire valider par le pharmacien, en vérifiant la composition.","k":"Aucune fiche officielle sur les pastilles antiseptiques (Strepsils, Valda, Halls) trouvée. Seule règle applicable : les pastilles contenant un AINS (flurbiprofène, type Strefen) tombent sous la règle des AINS, donc contre-indiquées à partir de 24 SA quelle que soit la voie","g":"CRAT (règle AINS seulement)","u":"https://www.lecrat.fr/4199/"},{"c":"Médicaments","o":"Sirop contre la toux","s":"Hélicidine, sirop","v":"prudence","p":"Seuls quelques antitussifs sont bien connus chez la femme enceinte, les mélanges et les sirops aux plantes manquent de données.","k":"Toux sèche : dextrométhorphane ou codéine possibles quel que soit le terme, doses respectées, durée brève, un seul principe actif (sirops aux plantes et antihistaminiques à éviter). Hélicidine : pas de risque rapporté mais on lui préfère les deux précédents. Toux grasse : ambroxol ou acétylcystéine (carbocistéine seulement au 1er trimestre)","g":"CRAT","u":"https://www.lecrat.fr/11851/"},{"c":"Médicaments","o":"Antihistaminique","s":"Zyrtec, allergie","v":"oui","p":"Ces antiallergiques sont bien étudiés chez la femme enceinte et aucun risque n'a été retenu.","k":"Quel que soit le terme pour cétirizine (Zyrtec), desloratadine, fexofénadine, lévocétirizine, loratadine ; azélastine nasale seulement après 10 SA","g":"CRAT","u":"https://www.lecrat.fr/3084/"},{"c":"Médicaments","o":"Somnifères","s":"Xanax, anxiolytique, Donormyl","v":"prudence","p":"Ces médicaments ne sont pas malformatifs, mais pris en fin de grossesse ils peuvent endormir le nouveau-né ou provoquer un sevrage.","k":"Uniquement sur prescription, jamais en automédication. Sommeil : doxylamine (Donormyl), zopiclone ou zolpidem possibles quel que soit le terme, durée la plus courte possible. Anxiété : hydroxyzine ou oxazépam préférés ; Xanax (alprazolam) envisageable seulement s'il a un vrai avantage, et ne jamais l'arrêter brutalement. Prévenir la maternité si pris jusqu'à l'accouchement","g":"CRAT","u":"https://www.lecrat.fr/3748/"},{"c":"Médicaments","o":"Magnésium","s":"","v":"aucune","p":"Faute de donnée officielle propre, seule s'applique la consigne générale sur les compléments, qui peuvent contenir des doses élevées déconseillées.","k":"Aucune fiche CRAT ni ANSM sur la supplémentation en magnésium pendant la grossesse dans les sources lues. Règle générale ameli : pas de complément sans en parler au médecin ou à la sage-femme","g":"Assurance Maladie (règle générale)","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/alimentation-grossesse"},{"c":"Médicaments","o":"Acide folique","s":"vitamine B9, folates","v":"oui","p":"La vitamine B9 aide à la bonne fermeture du tube neural de l'embryon et réduit le risque de spina bifida.","k":"Recommandé : sur prescription, au moins 4 semaines avant la conception et jusqu'à 12 SA ; 0,4 mg/j en population générale (5 mg/j en cas d'antécédent familial d'anomalie du tube neural)","g":"Assurance Maladie + CRAT","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/alimentation-grossesse"},{"c":"Médicaments","o":"Vitamine D","s":"","v":"oui","p":"Elle aide à absorber le calcium dont le squelette du bébé a besoin, surtout au 3e trimestre.","k":"Sur prescription du médecin ou de la sage-femme, éventuellement en deuxième partie de grossesse","g":"Assurance Maladie","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/alimentation-grossesse"},{"c":"Médicaments","o":"Fer","s":"supplément en fer, anémie","v":"prudence","p":"Les besoins en fer augmentent, surtout en fin de grossesse, mais la supplémentation se décide selon le bilan pour éviter l'anémie.","k":"Seulement si le médecin ou la sage-femme le prescrit (pas en automédication)","g":"Assurance Maladie","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/alimentation-grossesse"},{"c":"Médicaments","o":"Compléments alimentaires","s":"vitamines de grossesse, oméga 3","v":"prudence","p":"Bien qu'en vente libre, ils peuvent contenir des vitamines ou oligo-éléments à des doses déconseillées pendant la grossesse.","k":"Jamais sans avis du médecin ou de la sage-femme ; la B9 prescrite est la seule supplémentation systématique. Oméga 3 : pas de position officielle trouvée","g":"Assurance Maladie","u":"https://www.ameli.fr/assure/sante/devenir-parent/grossesse/grossesse-en-bonne-sante/grossesse-alimentation/alimentation-grossesse"},{"c":"Médicaments","o":"Homéopathie","s":"","v":"aucune","p":"Faute d'essais cliniques, le bénéfice ne peut pas être évalué ; le seul risque identifié est de retarder un vrai traitement.","k":"Le CRAT déclare ne pas pouvoir se prononcer ; aucun effet malformatif, fœtal ou néonatal rapporté, mais ne pas la substituer à un traitement nécessaire","g":"CRAT","u":"https://www.lecrat.fr/1048/"},{"c":"Médicaments","o":"Vermifuge","s":"Fluvermal, déparasiter, helmintox","v":"prudence","p":"Aucun risque malformatif retenu pour le flubendazole, mais au début de grossesse on privilégie le vermifuge le mieux connu.","k":"Sur avis médical. 1er trimestre : pyrantel préféré, Fluvermal (flubendazole) envisageable si pas d'alternative. 2e et 3e trimestres : flubendazole possible","g":"CRAT","u":"https://www.lecrat.fr/7591/"}]</script>
<script>
(function () {
  const KEY = "tempo-futurs-parents-v1";
  const DAY = 86400000;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
  const addDays = (d, n) => new Date(d.getTime() + n * DAY);
  const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const MOIS_C = ["J","F","M","A","M","J","J","A","S","O","N","D"];

  // Données d'exemple : un terme dans 7 semaines, une reprise en mars.
  const defaultTerme = addDays(today, 49);
  const repriseEx = new Date(defaultTerme.getFullYear() + (defaultTerme.getMonth() >= 2 ? 1 : 0), 2, 2);
  const defaults = {
    example: true,
    terme: iso(defaultTerme),
    reprise: iso(repriseEx).slice(0, 7),
    ville: "Paris",
    quartier: "19e",
    maternite: "Maternité Port-Royal",
    done: {},
    options: { municipale: true, parentale: true },
    parcours: { p_hcg: "fait", p_echo0: "fait", p_consult1: "fait", p_decl: "fait", p_diab: "fait", p_mater: "fait", p_echo1: "fait", p_epp: "fait", p_c4: "fait", p_c5: "fait", p_echo2: "fait", p_c6: "fait", p_c7: "fait", p_echo3: "fait", p_prepa: iso(today), p_c8: iso(addDays(today, 9)) },
    rdvs: [
      { id: "v1", t: "Échographie du 3e trimestre", date: iso(addDays(today, -10)), h: "10:30", lieu: "Cabinet d'échographie", q: "", n: "Tout va bien, bébé est tête en bas. Courbe de croissance normale.", example: true },
      { id: "v2", t: "Séance de préparation n° 4", date: iso(today), h: "18:00", lieu: "Maternité", q: "Quand faut-il partir à la maternité ?\nQue mettre dans la valise ?", n: "", example: true },
      { id: "v3", t: "Consultation du 8e mois", date: iso(addDays(today, 9)), h: "09:15", lieu: "Maternité", q: "", n: "", example: true }
    ],
    seances: [
      { date: iso(addDays(today, -18)), theme: "Le déroulé de l'accouchement", notes: "Les 3 phases du travail. Le moment de partir : la sage-femme envoie sa consigne par écrit.", doc: true },
      { date: iso(addDays(today, -11)), theme: "La douleur", notes: "Respiration, ballon, positions.", doc: false },
      { date: iso(addDays(today, -4)), theme: "Les premiers jours", notes: "", doc: false }
    ],
    projet: { douleur: "verrai", pendant: ["info"], apres: ["peau", "cordon"] },
    jourj: { tel: "", trajet: "Taxi", retour: "", prevenir: "" },
    quiz: {}, quizDone: false, quizStep: 0,
    valise: { vitale: true, dossier: true }, valiseRecos: [{ id: "r1", t: "Un brumisateur pour la salle de naissance", de: "Julie (exemple)", ok: false }],
    mat: { siegeauto: "acheter", chassis: "liste", gigoteuse: "liste", bodies: "recup", lit: "ai" },
    pieces: { domicile: true, impots: true },
    demarches: [
      { id: "d1", nom: "Crèche municipale", detail: "Mairie d'arrondissement", statut: "attente", last: iso(addDays(today, -26)), example: true },
      { id: "d2", nom: "Crèche parentale Les Petits Pas", detail: "Liste d'attente", statut: "attente", last: iso(addDays(today, -9)), example: true },
      { id: "d3", nom: "Relais Petite Enfance", detail: "Liste des assistantes maternelles", statut: "afaire", last: "", example: true }
    ]
  };
  let firstVisit = false;
  try { firstVisit = !localStorage.getItem(KEY); } catch (e) { firstVisit = true; }
  let S;
  try { S = Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY) || "null") || {}); } catch (e) { S = Object.assign({}, defaults); }
  if (!S.mat) S.mat = Object.assign({}, defaults.mat);
  // Statuts du matériel ramenés à 4 (23/10) : commandé et offert deviennent « J'ai », « pas besoin » redevient à choisir.
  Object.keys(S.mat).forEach(k => { const v = S.mat[k]; if (v === "commande" || v === "offert") S.mat[k] = "ai"; else if (!["ai", "recup", "liste", "acheter"].includes(v)) delete S.mat[k]; });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  // Quand on quitte l'exemple en changeant de terme, ses rendez-vous, séances, étapes cochées et démarches n'ont plus de sens
  // (bug vu par Sandra le 29/10 : une consultation du 8e mois « aujourd'hui » à 6 SA). Ce que la personne a saisi reste.
  function dropExample() {
    if (!S.example) return;
    S.rdvs = (S.rdvs || []).filter(r => !r.example && !r.imp); // imp = rendez-vous de l'import simulé, datés pour l'exemple
    S.demarches = (S.demarches || []).filter(d => !d.example);
    S.parcours = {}; S.seances = []; S.done = {};
    S.valiseRecos = (S.valiseRecos || []).filter(r => r.id !== "r1");
    // Champs encore à la valeur de l'exemple (Paris 19e, Port-Royal, checklist pré-remplie…) : on les vide.
    ["ville", "quartier", "maternite", "reprise"].forEach(k => { if (S[k] === defaults[k]) S[k] = ""; });
    const empty = { mat: {}, options: {}, pieces: {}, projet: {}, jourj: {}, valise: {} };
    Object.keys(empty).forEach(k => { if (JSON.stringify(S[k]) === JSON.stringify(defaults[k])) S[k] = empty[k]; });
    S.example = false;
  }
  let tab = "accueil";
  try { const h = location.hash.replace("#", ""); if (["garde", "accueil", "materiel", "suivi", "naissance"].includes(h)) tab = h; } catch (e) {}

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const tickSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

  // En France, le terme tombe à 41 semaines d'aménorrhée (SA).
  function pregnancy() {
    const terme = new Date(S.terme + "T00:00:00");
    const jours = Math.round((terme - today) / DAY);
    const saFloat = 41 - jours / 7;
    const sa = Math.max(0, Math.floor(saFloat));
    return { terme, jours, sa, saFloat };
  }
  function needDate() {
    const [y, m] = (S.reprise || "").split("-").map(Number);
    return y ? new Date(y, m - 1, 1) : null;
  }
  const PROOF = {
    officiel: ["officiel", "Recommandation officielle"],
    mairie: ["mairie", "Règle locale, à vérifier"],
    parents: ["parents", "Retour de parents"]
  };

  // Ce qui compte, rangé par niveau. sa = fenêtre d'affichage en semaines d'aménorrhée.
  function items() {
    const p = pregnancy();
    const need = needDate();
    const besoinTxt = need ? MOIS[need.getMonth()] + " " + need.getFullYear() : "le début de la garde";
    const list = [
      // Démarches
      { id: "choixgarde", lvl: "vital", sa: [15, 45], cond: !S.quizDone, t: "Choisir ton mode de garde", sub: "4 questions pour savoir quelle piste ouvrir",
        why: "Crèche, assistante maternelle, garde partagée : chaque mode a ses délais et ses démarches. Le choisir tôt laisse le temps d'agir, surtout si la garde commence ailleurs qu'en septembre.", proof: "parents", go: "garde" },
      { id: "preinscription", lvl: "vital", sa: [22, 45], cond: S.quizDone && (S.options.municipale || S.options.parentale), t: "Pré-inscrire bébé en crèche", sub: "Garde prévue pour " + besoinTxt,
        why: "Dans beaucoup de villes, dont Paris, la pré-inscription s'ouvre au 6e mois de grossesse. Les places sont rares et attribuées en commission : plus le dossier est déposé tôt, plus il passe tôt.", proof: "mairie", go: "garde" },
      { id: "congemat", lvl: "attendre", sa: [24, 45], t: "Préparer ton congé maternité", sub: "Prévenir ton employeur, vérifier tes droits",
        why: "Pour un premier ou un deuxième enfant, le congé commence en général 6 semaines avant le terme. Préviens ton employeur. Si tu es indépendante, les règles ne sont pas les mêmes : renseigne-toi auprès de ta caisse.", proof: "officiel" },
      { id: "congepat", lvl: "attendre", sa: [28, 45], t: "Préparer le congé paternité", sub: "Ou d'accueil de l'enfant, pour l'autre parent",
        why: "Il dure 25 jours, dont une partie à prendre juste après la naissance. L'employeur doit être prévenu au moins un mois avant la date prévue de l'accouchement.", proof: "officiel" },
      // S'équiper
      { id: "comprendre", lvl: "attendre", sa: [20, 45], t: "Comprendre le matériel", sub: "Nacelle, cosy, gigoteuse : ce que veulent dire les mots",
        why: "Avant de faire une liste, mieux vaut savoir à quoi sert chaque objet. Quelques animations suffisent pour ne plus confondre.", proof: "parents", go: "materiel", view: "comprendre" },
      { id: "checklist", lvl: "attendre", sa: [20, 45], cond: !!S.done.comprendre, t: "Faire ta checklist", sub: "Ce que tu as, ce qu'on te prête, ce qu'il reste à trouver",
        why: "Objet par objet, tu notes si tu l'as déjà, si un proche te le passe, s'il va sur ta liste de naissance ou si tu l'achètes.", proof: "parents", go: "materiel", view: "liste" },
      { id: "publierliste", lvl: "attendre", sa: [24, 45], t: "Publier ta liste de naissance", sub: "Un lien à envoyer à tes proches",
        why: "Tes proches voient ce qui reste à offrir, avec le modèle exact. Plus besoin de répondre à « qu'est-ce qui te ferait plaisir ? ».", proof: "parents", go: "materiel", view: "liste" },
      { id: "espace", lvl: "attendre", sa: [30, 45], t: "Aménager l'espace de bébé", sub: "Dans ta chambre, les premiers mois",
        why: "Les premiers mois, il est recommandé que bébé dorme dans la chambre de ses parents, dans son propre lit. Il suffit d'un lit et d'un coin pour le changer : sa chambre peut se finir après la naissance.", proof: "officiel" },
      { id: "laver", lvl: "attendre", sa: [34, 45], t: "Laver les vêtements de bébé", sub: "Un premier lavage avant de les porter",
        why: "Bodies, pyjamas, gigoteuse, langes : un lavage avant la naissance, et ils sont prêts à servir.", proof: "parents" },
      // Être prêt pour la naissance
      { id: "projet", lvl: "attendre", sa: [30, 40], t: "Écrire ton projet de naissance", sub: "Pas obligatoire, une page suffit",
        why: "Ce n'est pas un contrat : c'est une façon de dire ce qui compte pour toi. L'avoir pour la consultation d'anesthésie aide à en parler. Tempo t'aide à l'écrire en quelques réponses.", proof: "parents", go: "naissance", view: "projet" },
      { id: "valise", lvl: "vital", sa: [32, 45], t: "Préparer la valise de maternité", sub: "Pour toi et pour bébé",
        why: "La maternité donne souvent sa propre liste : pars de celle-là plutôt que d'en compiler trois. Une valise prête évite de la faire pendant les contractions.", proof: "parents", go: "valise" },
      { id: "jourj", lvl: "vital", sa: [34, 45], t: "Préparer le Jour J", sub: "Le numéro, le trajet, le retour avec bébé, qui prévenir",
        why: "Tout ce qui se décide avant : le numéro de la maternité, comment y aller, et le retour avec bébé. En voiture, il faut un siège auto installé avant le jour J ; en taxi, un taxi équipé ou ton cosy apporté.", proof: "parents", go: "naissance", view: "jourj" },
      // Préparer l'après
      { id: "secours", lvl: "vital", sa: [30, 45], t: "Écrire ta liste de secours", sub: "Qui appeler quand la fatigue tombe",
        why: "Les noms et numéros des personnes qui peuvent venir aider, d'une nurse de nuit, de ta sage-femme. Tu l'écris maintenant, à tête reposée. Après la naissance, tu n'auras plus qu'à appeler.", proof: "parents" },
      { id: "moisdor", lvl: "vital", sa: [30, 45], t: "Préparer ton mois d'or", sub: "Qui vient aider, les repas, les visites",
        why: "Les semaines qui suivent la naissance servent à récupérer. Les organiser avant, c'est savoir qui vient aider, comment on mange, et quand on reçoit.", proof: "parents", go: "naissance", view: "moisdor" },
      { id: "sagefemme", lvl: "attendre", sa: [34, 45], t: "Repérer ta sage-femme pour le retour à la maison", sub: "Elle vient chez toi après la sortie",
        why: "Après la sortie de la maternité, une sage-femme peut venir à la maison, pour toi et pour bébé. Selon les maternités, elle est proposée sur place ou c'est à toi d'en trouver une : renseigne-toi avant.", proof: "mairie" }
    ];
    // Suivi médical : une carte par étape du parcours ouverte et pas encore prise.
    PARCOURS.filter(st => !st.nocard && stepCard(st)).reverse().forEach(st => list.unshift({ id: "rdv_" + st.id, lvl: st.lvl || "vital", sa: [0, 45], t: st.card || "Prendre rendez-vous : " + st.t.charAt(0).toLowerCase() + st.t.slice(1), sub: st.cardSub || "À faire avant le " + fmtD(saDate(st.sa[1])), why: st.d || "C'est une étape de ton suivi.", proof: "officiel", go: "suivi" }));
    return list.filter(i => p.sa >= i.sa[0] && p.sa <= i.sa[1] && i.cond !== false);
  }

  function itemHTML(i) {
    const done = !!S.done[i.id];
    const pr = PROOF[i.proof];
    return '<details class="item' + (done ? " done" : "") + '" data-id="' + i.id + '">' +
      '<summary><button type="button" class="tick" data-tick="' + i.id + '" aria-label="' + (done ? "Marquer comme pas fait" : "Marquer comme fait") + '">' + tickSvg + '</button>' +
      '<span class="t">' + esc(i.t) + '<small>' + esc(i.sub) + '</small></span>' + chev + '</summary>' +
      '<div class="body"><p>' + esc(i.why) + '</p><span class="proof ' + pr[0] + '">' + pr[1] + '</span>' +
      (i.go ? '<button type="button" class="gotab" data-go="' + i.go + '"' + (i.view ? ' data-view="' + i.view + '"' : '') + '>' + ({ naissance: "Ouvrir l\'onglet Naissance", suivi: "Ouvrir le suivi médical", garde: "Ouvrir l\'onglet Garde", materiel: "Ouvrir l\'onglet Matériel", valise: "Ouvrir la checklist" })[i.go] + ' →</button>' : '') +
      '</div></details>';
  }

  function gardeCallout() {
    const need = needDate();
    if (!need) return "";
    const p = pregnancy();
    const ageMois = Math.max(0, Math.round((need - p.terme) / (30.44 * DAY)));
    if (need.getMonth() === 8) {
      return '<div class="callout ok"><h3>Garde : septembre, le bon mois</h3><p>Bébé aura environ ' + ageMois + ' mois. C\'est en septembre que le plus de places de crèche se libèrent, quand les grands partent à l\'école.</p><button type="button" class="gotab" data-go="garde">Voir mes démarches →</button></div>';
    }
    return '<div class="callout"><h3>Garde : ' + MOIS[need.getMonth()] + ', le mois difficile</h3><p>Bébé aura environ ' + ageMois + ' mois. La plupart des places de crèche se libèrent en septembre. Pour ' + MOIS[need.getMonth()] + ', il faut compter sur les désistements et ouvrir une deuxième piste dès maintenant.</p><button type="button" class="gotab" data-go="garde">Voir mes démarches →</button></div>';
  }

  function renderAccueil() {
    const p = pregnancy();
    const prog = Math.min(1, Math.max(0, p.saFloat / 41));
    const tri = [ [0, 15], [15, 28], [28, 41] ];
    const track = tri.map(([a, b]) => {
      const f = Math.min(1, Math.max(0, (p.saFloat - a) / (b - a)));
      return '<span><i style="width:' + (f * 100).toFixed(0) + '%"></i></span>';
    }).join("");
    const jours = p.jours;
    const sous = jours > 0 ? "Encore " + jours + " jour" + (jours > 1 ? "s" : "") + " avant le terme, le " + p.terme.getDate() + " " + MOIS[p.terme.getMonth()] + "."
      : jours === 0 ? "C'est le jour du terme." : "Le terme est passé de " + (-jours) + " jour" + (-jours > 1 ? "s" : "") + ".";
    const all = items();

  function resizeImage(file) {
    return new Promise(res => {
      const r = new FileReader();
      r.onload = () => { const img = new Image(); img.onload = () => {
        const sc = Math.min(1, 900 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.7)); }; img.onerror = () => res(null); img.src = r.result; };
      r.onerror = () => res(null); r.readAsDataURL(file);
    });
  }
