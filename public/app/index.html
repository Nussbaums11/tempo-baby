    if (el.dataset.doneMat) { S.mat[el.dataset.doneMat] = el.checked ? el.dataset.on : el.dataset.off; save(); const keep = window.scrollY; render(); window.scrollTo(0, keep); return; }
    if (el.dataset.notif) { S.notifs = S.notifs || {}; S.notifs[el.dataset.notif] = el.checked; save(); return; }
    if (el.dataset.reg) { const k = el.dataset.reg; if (k === "terme" && !el.value) return; if (k === "terme" && el.value !== S.terme) dropExample(); S[k] = el.value.trim ? el.value.trim() : el.value; if (k === "terme" || k === "reprise") S.example = false; save(); return; }
    if (el.id === "matIndisp") { S.matIndisp = el.checked; save(); const keep = window.scrollY; render(); window.scrollTo(0, keep); return; }
    if (el.dataset.mat) { S.mat[el.dataset.mat] = el.value; save(); const keep = window.scrollY; render(); window.scrollTo(0, keep); return; }
    if (el.dataset.statut) { const d = S.demarches.find(x => x.id === el.dataset.statut); if (d) { d.statut = el.value; save(); render(); } return; }
    if (el.id === "reprise") { S.reprise = el.value; S.example = false; save(); render(); return; }
    if (el.id === "ville" || el.id === "quartier") { S[el.id] = el.value.trim(); save(); const keep = window.scrollY; render(); window.scrollTo(0, keep); return; }
  });

  document.getElementById("view").addEventListener("submit", e => {
    if (e.target.id === "addRdv") {
      e.preventDefault();
      const t = document.getElementById("rdvT").value.trim(), d = document.getElementById("rdvD").value; if (!t || !d) return;
      S.rdvs = S.rdvs || [];
      S.rdvs.push({ id: "r" + Date.now(), t, date: d, h: document.getElementById("rdvH").value, lieu: document.getElementById("rdvL").value.trim(), q: "", n: "" });
      save(); render(); return;
    }
    if (e.target.id === "addReco") {
      e.preventDefault();
      const t = document.getElementById("recoT").value.trim(); if (!t) return;
      S.valiseRecos = S.valiseRecos || [];
      S.valiseRecos.push({ id: "r" + Date.now(), t, de: document.getElementById("recoDe").value.trim(), ok: false });
      save(); render(); return;
    }
    if (e.target.id === "addMat") {
      e.preventDefault();
      const n = document.getElementById("matN").value.trim(); if (!n) return;
      S.matCustom = S.matCustom || []; S.matCustom.push({ id: "c" + Date.now(), n }); S.matFilter = "tout";
      save(); render(); const el = document.getElementById("matN"); if (el) el.focus(); return;
    }
    if (e.target.id !== "addDem") return;
    e.preventDefault();
    const nom = document.getElementById("demNom").value.trim(); if (!nom) return;
    const statut = document.getElementById("demStatut").value;
    S.demarches.push({ id: "d" + Date.now(), nom, detail: document.getElementById("demDetail").value.trim(), statut, last: statut === "afaire" ? "" : iso(today) });
    save(); render();
  });

  function openWelcome(fromSettings) {
    const logo = '<span class="logo onb-logo">' + document.querySelector(".proto .logo").innerHTML + '</span>';
    const onb = () => document.getElementById("sheetBg").classList.add("onb");
    const close = () => { document.getElementById("sheetRoot").innerHTML = ""; tab = "accueil"; render(); window.scrollTo(0, 0); };
    openSheet(logo + '<h2>Bienvenue sur Tempo</h2><p>Tempo vous aide à savoir ce qui compte vraiment, semaine après semaine, jusqu\'à la naissance.</p>' +
      '<div style="display:grid;gap:8px"><button class="btn primary" type="button" id="wStart">Commencer</button>' +
      '<button class="btn" type="button" id="wDemo">' + (fromSettings ? 'Revenir à l\'app' : 'Découvrir avec un exemple') + '</button></div>');
    onb();
    document.getElementById("wDemo").addEventListener("click", () => { save(); document.getElementById("sheetRoot").innerHTML = ""; });
    document.getElementById("wStart").addEventListener("click", () => {
      openSheet(logo + '<h2>Pour commencer</h2><p>Trois infos, et c\'est parti. Le reste, Tempo vous le demandera au moment où il sert.</p>' +
        '<form id="wForm" style="display:grid;gap:12px"><div class="field"><label for="wMoi">Ton prénom</label><input id="wMoi" type="text" autocomplete="given-name" value="' + (fromSettings ? esc(S.moi || "") : "") + '" required></div>' +
        '<div class="field"><label for="wTerme">Date du terme</label><input id="wTerme" type="date" value="' + (fromSettings ? esc(S.terme || "") : "") + '" required></div>' +
        '<div class="field"><label for="wPrenom">Prénom de bébé (facultatif)</label><input id="wPrenom" type="text" placeholder="Si vous le connaissez déjà" value="' + (fromSettings ? esc(S.prenom || "") : "") + '"></div>' +
        '<p class="group-intro" id="wErr" hidden></p><button class="btn primary" type="submit" style="justify-self:start">Continuer</button></form>');
      onb();
      document.getElementById("wForm").addEventListener("submit", e => {
        e.preventDefault();
        const moi = document.getElementById("wMoi").value.trim(), t = document.getElementById("wTerme").value, err = document.getElementById("wErr");
        if (!moi || !t) { err.textContent = !moi ? "Indique ton prénom." : "Indique la date du terme."; err.hidden = false; return; }
        if (fromSettings && t !== S.terme) dropExample();
        if (fromSettings) Object.assign(S, { moi, terme: t, prenom: document.getElementById("wPrenom").value.trim(), example: false });
        else Object.assign(S, { moi, prenom: document.getElementById("wPrenom").value.trim(), ville: "", quartier: "", maternite: "", alim: "", example: false, terme: t, reprise: "", done: {}, options: {}, pieces: {}, demarches: [], mat: {}, parcours: {}, rdvs: [], seances: [], projet: {}, jourj: {}, quiz: {}, quizDone: false, quizStep: 0, valise: {}, valiseRecos: [], matCustom: [], listeOfferts: {}, matLinks: {}, matPrix: {}, listePub: {}, moisdor: {}, coparent: {}, naissance: null });
        save();
        const co = S.coparent || {};
        if (co.envoye) { close(); return; }
        openSheet(logo + '<span class="pill">Bientôt disponible</span><h2>Invitez l\'autre parent</h2><p>Tempo se vit à deux : vous verrez les mêmes rendez-vous, la même liste et les mêmes démarches. Ce qu\'il faut faire et quand ne restera plus dans une seule tête.</p>' +
          '<p>L\'invitation arrive dans une prochaine version.</p>' +
          '<button class="btn primary" type="button" id="wLater" style="justify-self:start">Continuer</button>');
        onb();
        document.getElementById("wLater").addEventListener("click", close);
      });
    });
  }

  applyTheme();
  render();
  if (firstVisit) openWelcome();
})();
</script>

</body></html>
